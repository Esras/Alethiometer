<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New agent, OpenShell, existing sandbox</title>
<script src="../support.js"></script>
<link rel="stylesheet" href="ds/alethiometer/tokens.css">
<link rel="stylesheet" href="./na.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0f1012}
a{color:#8ec07c}a:hover{color:#b8bb26}
</style>
</helmet>
<div class="na" style="width:780px;height:480px;box-sizing:border-box;padding:20px;background:#0f1012;display:flex;justify-content:center;align-items:flex-start">
<div class="m" role="dialog" aria-label="New agent, existing sandbox">
<div class="top"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6M19 8v6M16 11h6"></path></svg><span class="t">New agent</span><label class="lab" for="d-name" style="margin-left:10px">Name</label><span class="in sm nm"><input id="d-name" placeholder="pi-…"></span><span class="chips ml" role="radiogroup" aria-label="Where it runs"><button class="chip" role="radio" aria-checked="false">Local</button><button class="chip on" role="radio" aria-checked="true">OpenShell</button></span><span class="kbd">Esc</span></div>
<div class="joins"><span class="lab">Joins</span><span class="proj">alethiometer ›</span><button class="pick" aria-haspopup="listbox">Unsorted<svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><span class="mem newm"><span class="ring"></span><span style="opacity:.7">pi-…</span></span></div>
<div class="body">
<textarea aria-label="Task, sent as the first prompt" rows="3" placeholder="What should it do?"></textarea>
<div class="fields">
<span class="lab">Directory</span>
<div class="dirs" role="group" aria-label="Directory inside the sandbox"><span class="dir" title="/sandbox/alethiometer, inside the sandbox">/sandbox/alethiometer<button class="x" aria-label="Remove /sandbox/alethiometer"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></div>
<span class="lab">Agent</span>
<div class="agent"><span class="chips" role="radiogroup" aria-label="Harness"><button class="chip on" role="radio" aria-checked="true">Pi</button><button class="chip" role="radio" aria-checked="false">Claude Code</button></span><button class="in" aria-haspopup="listbox" aria-label="Model"><span class="v">amazon-bedrock/Claude Opus 4.5 (US)</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="in th" aria-haspopup="listbox" aria-label="Thinking"><span class="k">thinking</span><span class="v">medium</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<span class="lab">Sandbox</span>
<div class="row3" style="grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)"><button class="in" aria-haspopup="listbox" aria-label="Gateway"><span class="v">local · active</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="in f" aria-haspopup="listbox" aria-label="Sandbox"><span class="v">aleth-3f9c1e02 · ready</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
</div>
<div class="hint"><span class="k">Sandbox</span><span>the harness must be in its image; the directory is a path inside it</span></div>
</div>
<div class="foot"><button class="btn p">Start agent<span class="kbd">⌘⏎</span></button><button class="btn">Cancel<span class="kbd">Esc</span></button><span class="cmd"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l5 5-5 5M12 18h8"></path></svg><span>openshell -g local sandbox exec -n aleth-3f9c1e02 -- pi-acp</span></span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":780,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
