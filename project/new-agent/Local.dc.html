<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New agent, local</title>
<script src="../support.js"></script>
<link rel="stylesheet" href="ds/alethiometer/tokens.css">
<link rel="stylesheet" href="./na.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0f1012}
a{color:#8ec07c}a:hover{color:#b8bb26}
</style>
</helmet>
<div class="na" style="width:780px;height:440px;box-sizing:border-box;padding:20px;background:#0f1012;display:flex;justify-content:center;align-items:flex-start">
<div class="m" role="dialog" aria-label="New agent, local">
<div class="top"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6M19 8v6M16 11h6"></path></svg><span class="t">New agent</span><label class="lab" for="b-name" style="margin-left:10px">Name</label><span class="in sm nm"><input id="b-name" placeholder="claude-…"></span><span class="chips ml" role="radiogroup" aria-label="Where it runs"><button class="chip on" role="radio" aria-checked="true">Local</button><button class="chip" role="radio" aria-checked="false">OpenShell</button></span><span class="kbd">Esc</span></div>
<div class="joins"><span class="lab">Joins</span><span class="proj">alethiometer ›</span><button class="pick" aria-haspopup="listbox">Settings polish<svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><span class="mem"><span class="run"></span><span style="color:#7fb3d5">planner</span></span><span class="mem"><span class="idle"></span><span style="color:#b9a6e0">claude-7c1</span></span><span class="mem newm"><span class="ring"></span><span style="opacity:.7">claude-…</span></span></div>
<div class="body">
<textarea aria-label="Task, sent as the first prompt" rows="3" placeholder="What should it do?" value="Settings › Agents: the harness list overflows at 1280px. Fix the layout, then run the ui-diff for the settings scenes."></textarea>
<div class="fields">
<span class="lab">Directories</span>
<div class="dirs" role="group" aria-label="Directories"><span class="dir" title="~/src/alethiometer">alethiometer<button class="x" aria-label="Remove alethiometer"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span><input aria-label="Add a directory" placeholder="add a path…"><button class="ib" aria-label="Browse for a directory"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v2"></path><path d="M3 19l3-8h16l-3 8z"></path></svg></button></div>
<span class="lab">Agent</span>
<div class="agent"><span class="chips" role="radiogroup" aria-label="Harness"><button class="chip" role="radio" aria-checked="false">Pi</button><button class="chip on" role="radio" aria-checked="true">Claude Code</button></span><button class="in f" aria-haspopup="listbox" aria-label="Model"><span class="v">Claude Sonnet 4.5</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="in th" aria-haspopup="listbox" aria-label="Thinking"><span class="k">thinking</span><span class="v">high</span><svg class="ph ph-caret-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
</div>
<div class="hint"><span class="k">Model</span><span>9 from Claude Code; the first is the harness’s own</span></div>
</div>
<div class="foot"><button class="btn p">Start agent<span class="kbd">⌘⏎</span></button><button class="btn">Cancel<span class="kbd">Esc</span></button><span class="cmd"><svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l5 5-5 5M12 18h8"></path></svg><span>cd ~/src/alethiometer &amp;&amp; npx -y @agentclientprotocol/claude-agent-acp</span></span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":780,"height":440}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
