<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:60},&quot;highlight&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;acme&quot;,&quot;q4&quot;],&quot;default&quot;:&quot;acme&quot;,&quot;tsType&quot;:&quot;'none'|'acme'|'q4'&quot;}}">
class Component extends DCLogic {
  state = { t0: Date.now(), now: Date.now() };
  componentDidMount() { this._iv = setInterval(() => this.setState({ now: Date.now() }), 15000); }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const left = Math.max(0, 8 - Math.floor((this.state.now - this.state.t0) / 60000));
    const h = this.props.highlight ?? 'none';
    return { nextLabel: left === 0 ? 'now' : 'in ' + left + ' min', hlAcme: h === 'acme', hlQ4: h === 'q4' };
  }
}
</script>
