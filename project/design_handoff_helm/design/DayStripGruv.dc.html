<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:60},&quot;highlight&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;acme&quot;,&quot;q4&quot;,&quot;datadog&quot;],&quot;default&quot;:&quot;datadog&quot;,&quot;tsType&quot;:&quot;'none'|'acme'|'q4'|'datadog'&quot;},&quot;minutes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:60,&quot;tsType&quot;:&quot;number&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;life&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;titled&quot;,&quot;busy&quot;],&quot;default&quot;:&quot;titled&quot;,&quot;tsType&quot;:&quot;'titled'|'busy'&quot;}}">
class Component extends DCLogic {
  state = { t0: Date.now(), now: Date.now() };
  componentDidMount() { this._iv = setInterval(() => this.setState({ now: Date.now() }), 15000); }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const start = parseInt(this.props.minutes ?? 8, 10);
    const s = isNaN(start) ? 8 : start;
    const left = Math.max(0, s - Math.floor((this.state.now - this.state.t0) / 60000));
    const h = this.props.highlight ?? 'none';
    const c = left > 15 ? '#b8bb26' : left > 5 ? '#fabd2f' : left > 2 ? '#fe8019' : '#fb4934';
    const note = this.props.note ?? '';
    return {
      nextLabel: left === 0 ? 'now' : 'in ' + left + ' min',
      urgColor: c,
      urgBar: Math.round(Math.max(0, 1 - left / 30) * 100) + '%',
      hlAcme: h === 'acme', hlQ4: h === 'q4', hlDD: h === 'datadog',
      hasNote: !!note, note,
      lifeBusy: this.props.life === 'busy', lifeTitled: this.props.life !== 'busy'
    };
  }
}
</script>
