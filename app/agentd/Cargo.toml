[package]
name = "alethiometer-agentd"
version = "0.1.0"
edition = "2021"
description = "Hosts Alethiometer's local ACP agents so they outlive the app"

# Kept small on purpose: the daemon runs from a copy in the data directory and
# outlives app rebuilds, so it should rarely need to change (docs/agents.md).

[lib]
name = "agentd"
path = "src/lib.rs"

[[bin]]
name = "alethiometer-agentd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
