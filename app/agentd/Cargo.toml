[package]
name = "alethiometer-agentd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Hosts Alethiometer's local ACP agents so they outlive the app"

# Kept small on purpose: the daemon runs from a copy in the data directory and
# outlives app rebuilds, so it should rarely need to change (docs/agents.md).

[lib]
name = "agentd"
path = "src/lib.rs"

[[bin]]
name = "alethiometer-agentd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# AF_UNIX sockets on Windows (std has them on Unix only).
uds_windows = "1.2"
# Job objects, so Kill ends an agent's whole process tree.
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
