[package]
name = "alethiometer-settings"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "settings.json: the typed settings, their validation and the Settings page's schema"

[lib]
name = "alethiometer_settings"
path = "src/lib.rs"

[dependencies]
alethiometer-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
schemars = { version = "1.2", features = ["preserve_order"] }
