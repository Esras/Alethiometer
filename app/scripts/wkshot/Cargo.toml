[package]
name = "wkshot"
version = "0.1.0"
edition = "2021"
[dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = { package = "javascriptcore-rs", version = "1.1" }
cairo-rs = { version = "0.18", features = ["png"] }
glib = "0.18"
gio = "0.18"
gdk = "0.18"
