[package]
name = "alethiometer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "alethiometer"

[lib]
name = "alethiometer_lib"
crate-type = ["rlib"]

[[bin]]
name = "alethiometer"
path = "src/main.rs"
required-features = ["desktop"]

# Browser-mode bridge: serves the same `call` API over HTTP so the UI can be
# developed in a plain browser (no WebKitGTK needed).
[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
tauri = { version = "2.12", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "jiff", "hooks"] }
# Reader connections for `store::Db` (the writer is one connection behind a mutex).
r2d2 = "0.8"
r2d2_sqlite = "0.35"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
dirs = "7"
tiny_http = "0.12"
regex = "1"
glob = "0.3"
# Agents tab: parses shell commands for the approval card's Parsed panel.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# Quoting an OpenShell command line for a terminal.
shlex = "2"
ureq = { version = "3", features = ["json"] }
# Slack Socket Mode websocket; rustls + webpki roots, the same TLS stack ureq uses.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Google OAuth PKCE (SHA-256, CSPRNG, base64url). Both already come in via ureq/rustls.
ring = "0.17"
base64 = "0.23"
# direnv's DIRENV_WATCHES is zlib-compressed (agents: has the devshell changed?). Already in via tauri.
flate2 = "1"
# Proton ICS: recurrence expansion (RRULE/EXDATE/RDATE) and IANA time zones.
rrule = "0.14"
chrono-tz = "0.10"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
# Obsidian: file watcher so vault edits sync right away (the poll still runs).
notify = "8.2"
# canonicalize() without Windows' `\\?\` prefix, which Obsidian URLs and vault-relative paths can't use.
dunce = "1"
# SigV4 signing for Bedrock (AWS-maintained; avoids the full AWS SDK + tokio).
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"
# settings.json schema: drives the Settings page and validates hand edits.
schemars = { version = "1.2", features = ["preserve_order"] }
# Installed font families for the Type settings (pure Rust).
fontdb = "0.23"
# Local embeddings: ONNX inference in pure Rust (no native runtime to ship),
# the model's own tokenizer, and vectors in SQLite.
tract-onnx = { version = "0.23", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sqlite-vec = "0.1.6"
# The agent host's protocol and client (app/agentd): local agents run there and outlive the app.
alethiometer-agentd = { path = "../agentd" }
# Time, errors, the domain model and ports, and the SQLite store.
alethiometer-core = { path = "../core" }
# settings.json: the typed settings, validation and the Settings page schema.
alethiometer-settings = { path = "../settings" }
# Atomic file writes, the secrets file, opening URLs.
alethiometer-platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3"
alethiometer-core = { path = "../core", features = ["test-support"] }

[profile.dev]
debug = "line-tables-only"
